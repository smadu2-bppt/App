<!DOCTYPE html>
<html lang="id" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi SIDAPET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full w-full m-0 p-0 overflow-hidden bg-slate-900" x-data="{ loaded: false }">

  <div x-show="!loaded" class="fixed inset-0 flex items-center justify-center bg-slate-900 text-white z-50">
    <div class="flex flex-col items-center gap-3">
      <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
      <span class="text-sm font-medium tracking-wide">Memuat Aplikasi...</span>
    </div>
  </div>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbwTLCU7vv57HAqU9hR0RbuEJJ75yDX-ZNvm01PEn0iRlehjvOZ7ENGU_M4bFmx_pAtvkQ/exec" 
    class="w-full h-full border-0"
    @load="loaded = true"
    allow="geolocation; microphone; camera; clipboard-write">
  </iframe>

</body>
</html>
